<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keba — You're Offline</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      color: #ef4444;
      letter-spacing: -0.05em;
      margin-bottom: 2.5rem;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      color: #475569;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #f1f5f9;
    }

    p {
      color: #64748b;
      font-size: 1rem;
      line-height: 1.6;
      max-width: 360px;
      margin: 0 auto 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }

    .btn:hover { background: #b91c1c; }

    .status {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #334155;
      min-height: 1.5rem;
    }

    .status.online { color: #22c55e; }
  </style>
</head>
<body>
  <div class="logo">KEBA</div>

  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="1" y1="1" x2="23" y2="23"/>
    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
    <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
    <circle cx="12" cy="20" r="1"/>
  </svg>

  <h1>You're Offline</h1>
  <p>Check your internet connection and try again. Your previously visited pages may still be available.</p>

  <button class="btn" onclick="tryReload()">Try Again</button>

  <p class="status" id="status"></p>

  <script>
    function tryReload() {
      window.location.reload();
    }

    // Auto-reload when the connection comes back
    window.addEventListener('online', () => {
      document.getElementById('status').textContent = 'Connection restored — reloading…';
      document.getElementById('status').className = 'status online';
      setTimeout(() => window.location.reload(), 800);
    });

    window.addEventListener('offline', () => {
      document.getElementById('status').textContent = 'Still offline…';
      document.getElementById('status').className = 'status';
    });
  </script>
</body>
</html>
